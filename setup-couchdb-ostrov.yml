- name: Install CouchDB on ostrov via Docker for Obsidian LiveSync
  hosts: "ostrov:&servers"
  gather_facts: true
  become: true

  vars:
    couchdb_root: /opt/couchdb
    couchdb_data_dir: "{{ couchdb_root }}/data"
    couchdb_local_config_dir: "{{ couchdb_root }}/local.d"
    couchdb_compose_file: "{{ couchdb_root }}/docker-compose.yml"
    couchdb_container_name: couchdb
    couchdb_image: "couchdb:3.5.1"
    couchdb_port: 5984
    couchdb_bind_address: "{{ ansible_host }}"
    couchdb_uid: 5984
    couchdb_gid: 5984
    couchdb_admin_user: obsidian
    couchdb_admin_password: "CHANGE_ME"
    couchdb_cors_origins:
      - app://obsidian.md
      - capacitor://localhost
      - http://localhost
    couchdb_cors_methods:
      - GET
      - PUT
      - POST
      - HEAD
      - DELETE
    couchdb_cors_headers:
      - accept
      - authorization
      - content-type
      - origin
      - referer
    couchdb_max_http_request_size: "4294967296"
    couchdb_max_document_size: "50000000"
    compose_plugin_version: v2.33.1
    compose_arch_map:
      x86_64: x86_64
      amd64: x86_64
      aarch64: aarch64
      arm64: aarch64

  pre_tasks:
    - name: Require a real CouchDB admin password
      ansible.builtin.assert:
        that:
          - couchdb_admin_password != "CHANGE_ME"
          - couchdb_admin_password | length >= 16
        fail_msg: >-
          Set couchdb_admin_password to a strong value, for example:
          ansible-playbook setup-couchdb-ostrov.yml -e 'couchdb_admin_password=...'

    - name: Require a bind address for Tailscale access
      ansible.builtin.assert:
        that:
          - couchdb_bind_address is defined
          - couchdb_bind_address | length > 0
        fail_msg: "couchdb_bind_address must be set. For ostrov over Tailscale it is usually the host ansible_host."

  tasks:
    - name: Install Docker and required packages
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
        state: present
        update_cache: true

    - name: Try to install Docker Compose plugin package
      ansible.builtin.apt:
        name: docker-compose-plugin
        state: present
      register: compose_plugin_install
      failed_when: false

    - name: Install legacy docker-compose package when plugin is unavailable
      ansible.builtin.apt:
        name: docker-compose
        state: present
      when: compose_plugin_install.rc is defined and compose_plugin_install.rc != 0

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Detect Docker Compose v2 command
      ansible.builtin.shell: |
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
        else
          exit 1
        fi
      register: docker_compose_detect
      changed_when: false
      failed_when: false

    - name: Ensure Docker CLI plugins directory exists
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: docker_compose_detect.rc != 0

    - name: Install Docker Compose v2 CLI plugin binary fallback
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ compose_plugin_version }}/docker-compose-linux-{{ compose_arch_map.get(ansible_facts['architecture'], 'x86_64') }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: "0755"
      when: docker_compose_detect.rc != 0

    - name: Re-detect Docker Compose v2 command after plugin fallback
      ansible.builtin.shell: |
        if docker compose version >/dev/null 2>&1; then
          echo "docker compose"
        elif command -v docker-compose >/dev/null 2>&1; then
          echo "docker-compose"
        else
          exit 1
        fi
      register: docker_compose_detect_retry
      changed_when: false
      failed_when: false

    - name: Choose effective Docker Compose detection result
      ansible.builtin.set_fact:
        docker_compose_detect_effective: "{{ docker_compose_detect_retry if docker_compose_detect.rc != 0 else docker_compose_detect }}"

    - name: Fail if Docker Compose is still unavailable
      ansible.builtin.fail:
        msg: "Neither 'docker compose' nor 'docker-compose' is available after fallback installation."
      when: docker_compose_detect_effective.rc != 0

    - name: Set Docker Compose command fact
      ansible.builtin.set_fact:
        docker_compose_cmd: "{{ docker_compose_detect_effective.stdout }}"

    - name: Create CouchDB root directory
      ansible.builtin.file:
        path: "{{ couchdb_root }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create CouchDB writable directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ couchdb_uid }}"
        group: "{{ couchdb_gid }}"
        mode: "0750"
      loop:
        - "{{ couchdb_data_dir }}"
        - "{{ couchdb_local_config_dir }}"

    - name: Write CouchDB docker compose file
      ansible.builtin.template:
        src: templates/docker-compose-couchdb-ostrov.yml.j2
        dest: "{{ couchdb_compose_file }}"
        owner: root
        group: root
        mode: "0640"

    - name: Pull CouchDB image
      ansible.builtin.command:
        cmd: "{{ docker_compose_cmd }} pull"
        chdir: "{{ couchdb_root }}"
      changed_when: true

    - name: Start CouchDB container
      ansible.builtin.command:
        cmd: "{{ docker_compose_cmd }} up -d"
        chdir: "{{ couchdb_root }}"
      changed_when: true

    - name: Wait for CouchDB API to become ready
      ansible.builtin.uri:
        url: "http://{{ couchdb_bind_address }}:{{ couchdb_port }}/_up"
        method: GET
        status_code: 200
      register: couchdb_ready
      retries: 20
      delay: 3
      until: couchdb_ready.status == 200

    - name: Validate CouchDB admin credentials
      ansible.builtin.uri:
        url: "http://{{ couchdb_bind_address }}:{{ couchdb_port }}/_session"
        method: GET
        user: "{{ couchdb_admin_user }}"
        password: "{{ couchdb_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: couchdb_auth_check
      failed_when: false

    - name: Require matching CouchDB admin credentials
      ansible.builtin.fail:
        msg: >-
          CouchDB is already running, but the provided credentials do not match the existing admin user.
          This usually means /opt/couchdb/data already contains an initialized database with another password.
          Re-run with the original couchdb_admin_password or reset CouchDB data on ostrov if you want a fresh install.
      when: couchdb_auth_check.status | default(0) != 200

    - name: Enable single-node mode
      ansible.builtin.uri:
        url: "http://{{ couchdb_bind_address }}:{{ couchdb_port }}/_cluster_setup"
        method: POST
        user: "{{ couchdb_admin_user }}"
        password: "{{ couchdb_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          action: enable_single_node
          username: "{{ couchdb_admin_user }}"
          password: "{{ couchdb_admin_password }}"
          bind_address: "0.0.0.0"
          port: "{{ couchdb_port }}"
          node_count: 1
        status_code:
          - 200
          - 201
          - 202
          - 409

    - name: Finish cluster setup
      ansible.builtin.uri:
        url: "http://{{ couchdb_bind_address }}:{{ couchdb_port }}/_cluster_setup"
        method: POST
        user: "{{ couchdb_admin_user }}"
        password: "{{ couchdb_admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          action: finish_cluster
        status_code:
          - 200
          - 201
          - 202
          - 400
          - 409

    - name: Apply CouchDB runtime config required by LiveSync
      ansible.builtin.uri:
        url: "http://{{ couchdb_bind_address }}:{{ couchdb_port }}/_node/_local/_config/{{ item.section }}/{{ item.key }}"
        method: PUT
        user: "{{ couchdb_admin_user }}"
        password: "{{ couchdb_admin_password }}"
        force_basic_auth: true
        body: "{{ item.value | to_json }}"
        status_code: 200
      loop:
        - section: chttpd
          key: require_valid_user
          value: "true"
        - section: chttpd_auth
          key: require_valid_user
          value: "true"
        - section: httpd
          key: enable_cors
          value: "true"
        - section: chttpd
          key: enable_cors
          value: "true"
        - section: cors
          key: credentials
          value: "true"
        - section: cors
          key: origins
          value: "{{ couchdb_cors_origins | join(',') }}"
        - section: cors
          key: methods
          value: "{{ couchdb_cors_methods | join(', ') }}"
        - section: cors
          key: headers
          value: "{{ couchdb_cors_headers | join(', ') }}"
        - section: chttpd
          key: max_http_request_size
          value: "{{ couchdb_max_http_request_size }}"
        - section: couchdb
          key: max_document_size
          value: "{{ couchdb_max_document_size }}"

    - name: Show connection summary
      ansible.builtin.debug:
        msg:
          - "CouchDB is listening on http://{{ couchdb_bind_address }}:{{ couchdb_port }}"
          - "Use rif nginx as HTTPS reverse proxy to {{ couchdb_bind_address }}:{{ couchdb_port }}"
          - "Admin user: {{ couchdb_admin_user }}"
