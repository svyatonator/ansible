- name: Setup and configure fail2ban on Ubuntu 22
  hosts: servers
  gather_facts: true
  become: true

  vars:
    nginx_container_name: nginx
    couchdb_domain: ob.volna.ovh

  tasks:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present
        update_cache: true

    - name: Ensure fail2ban is enabled and started
      ansible.builtin.service:
        name: fail2ban
        enabled: true
        state: started

    - name: Check if docker nginx container is running
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - "name=^/{{ nginx_container_name }}$"
          - --format
          - "{% raw %}{{.Names}}{% endraw %}"
      register: nginx_running
      failed_when: false
      changed_when: false

    - name: Get docker nginx log path
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ nginx_container_name }}"
          - --format
          - "{% raw %}{{.LogPath}}{% endraw %}"
      register: nginx_logpath
      changed_when: false
      when: nginx_running.stdout == nginx_container_name

    - name: Set nginx fail2ban facts
      ansible.builtin.set_fact:
        nginx_fail2ban_enabled: "{{ nginx_running.stdout == nginx_container_name }}"
        nginx_fail2ban_logpath: "{{ nginx_logpath.stdout | default('') }}"

    - name: Create nginx CouchDB auth fail2ban filter
      ansible.builtin.template:
        src: templates/fail2ban-nginx-couchdb-auth.conf.j2
        dest: /etc/fail2ban/filter.d/nginx-couchdb-auth.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban
      when: nginx_fail2ban_enabled | bool

    - name: Create nginx CouchDB auth recidive fail2ban filter
      ansible.builtin.template:
        src: templates/fail2ban-nginx-couchdb-auth-recidive.conf.j2
        dest: /etc/fail2ban/filter.d/nginx-couchdb-auth-recidive.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban
      when: nginx_fail2ban_enabled | bool

    - name: Check if cockpit is installed
      ansible.builtin.systemd:
        name: cockpit.socket
      register: cockpit_service
      failed_when: false
      changed_when: false

    - name: Set cockpit fail2ban fact
      ansible.builtin.set_fact:
        cockpit_fail2ban_enabled: "{{ cockpit_service.status is defined and cockpit_service.status.LoadState == 'loaded' }}"

    - name: Create cockpit fail2ban filter
      ansible.builtin.copy:
        dest: /etc/fail2ban/filter.d/cockpit.conf
        content: |
          [Definition]
          failregex = ^.*cockpit-ws\[[0-9]+\]: .* Login failed for .*from <HOST>.*$
                      ^.*cockpit-session\[[0-9]+\]: pam_unix\(cockpit:auth\): authentication failure; .* rhost=<HOST>.*$
                      ^.*cockpit-session\[[0-9]+\]: pam_succeed_if\(cockpit:auth\): requirement .* not met by user .*\(authenticated from <HOST>\)$
          ignoreregex =
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban
      when: cockpit_service.status is defined and cockpit_service.status.LoadState == "loaded"

    - name: Write jail.local configuration
      ansible.builtin.template:
        src: templates/fail2ban-jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban

    - name: Flush fail2ban handlers
      ansible.builtin.meta: flush_handlers

    - name: Ensure fail2ban service is running after config update
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Wait for fail2ban socket
      ansible.builtin.wait_for:
        path: /var/run/fail2ban/fail2ban.sock
        state: present
        timeout: 30

    - name: Verify fail2ban configuration
      ansible.builtin.command: fail2ban-client -t
      register: fail2ban_test
      changed_when: false
      failed_when: fail2ban_test.rc != 0

    - name: Get fail2ban status
      ansible.builtin.command: fail2ban-client status
      register: fail2ban_status
      changed_when: false

    - name: Print fail2ban status
      ansible.builtin.debug:
        msg: "{{ fail2ban_status.stdout_lines }}"

  handlers:
    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
